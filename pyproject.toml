[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "py-crow-tool"
version = "0.1.0"
description = "Native PySide 6 translation desktop application"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "PySide6>=6.7,<7",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "tomli-w>=1.0,<2",
  "google-auth>=2.30,<3",
  "requests>=2.32,<3",
  "Pillow>=10.3,<12",
  "pytesseract>=0.3.10,<1",
]

[project.optional-dependencies]
windows = ["pywin32>=306", "keyboard>=0.13.5"]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-qt>=4.4", "respx>=0.21"]
build = ["pyinstaller>=6.8"]

[project.scripts]
py-crow = "py_crow_tool.cli:main"
py-crow-gui = "py_crow_tool.app:main"

[project.entry-points."py_crow_tool.providers"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_crow_tool"]

[tool.hatch.build.targets.wheel.force-include]
"src/py_crow_tool/qml" = "py_crow_tool/qml"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
